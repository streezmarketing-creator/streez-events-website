<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Oval Emblem Gradient: Deep Royal Navy to Vivid Electric Cyan -->
    <linearGradient id="streezBadgeGrad" x1="5%" y1="95%" x2="95%" y2="5%">
      <stop offset="0%" stop-color="#021c7d" />
      <stop offset="35%" stop-color="#0443c0" />
      <stop offset="70%" stop-color="#0096d2" />
      <stop offset="100%" stop-color="#00d5c3" />
    </linearGradient>

    <!-- Wordmark Gradient: Navy Blue to Cyan Glow -->
    <linearGradient id="streezTextGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#061952" />
      <stop offset="28%" stop-color="#0b2c75" />
      <stop offset="60%" stop-color="#0456a2" />
      <stop offset="85%" stop-color="#009bb8" />
      <stop offset="100%" stop-color="#00ded0" />
    </linearGradient>

    <!-- Subtle drop shadow for premium depth -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00d5c3" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="streez-brand-logo">
    <!-- Oval Emblem Background -->
    <ellipse cx="300" cy="170" rx="170" ry="125" fill="url(#streezBadgeGrad)" filter="url(#badgeShadow)" />

    <!-- Stylized Geometric "S" Monogram in Crisp White -->
    <g fill="#FFFFFF">
      <!-- Upper Section of S: Angled roof apex and folding ribbon -->
      <path d="M 300 56 
               L 374 114 
               L 374 196 
               L 318 152 
               L 318 132 
               L 300 118 
               L 254 152 
               L 220 126 
               Z" />

      <!-- Lower Section of S: Inverted folding ribbon matching upper geometry -->
      <path d="M 300 284 
               L 226 226 
               L 226 144 
               L 282 188 
               L 282 208 
               L 300 222 
               L 346 188 
               L 380 214 
               Z" />

      <!-- Center diagonal cuts defining the negative space slash -->
      <polygon points="225,130 282,174 282,204 225,160" />
      <polygon points="375,210 318,166 318,136 375,180" />
    </g>

    <!-- Futuristic Bold Display Wordmark: STREEZ -->
    <g transform="translate(18, -10)">
      <!-- S -->
      <path d="M 45 385 
               L 78 350 
               L 126 350 
               L 126 368 
               L 82 368 
               L 70 380 
               L 112 380 
               L 130 398 
               L 130 416 
               L 92 452 
               L 44 452 
               L 44 434 
               L 92 434 
               L 106 420 
               L 64 420 
               L 45 402 
               Z" 
            fill="url(#streezTextGrad)" />

      <!-- T -->
      <path d="M 136 350 
               L 214 350 
               L 204 368 
               L 186 368 
               L 186 452 
               L 164 452 
               L 164 368 
               L 146 368 
               Z" 
            fill="url(#streezTextGrad)" />

      <!-- R -->
      <path d="M 222 350 
               L 278 350 
               L 292 364 
               L 292 398 
               L 278 410 
               L 296 452 
               L 270 452 
               L 256 414 
               L 246 414 
               L 246 452 
               L 222 452 
               Z 
               M 246 368 
               L 246 396 
               L 270 396 
               L 270 368 
               Z" 
            fill="url(#streezTextGrad)" />

      <!-- E 1 -->
      <path d="M 302 350 
               L 362 350 
               L 362 368 
               L 326 368 
               L 326 392 
               L 356 392 
               L 356 408 
               L 326 408 
               L 326 434 
               L 364 434 
               L 354 452 
               L 302 452 
               Z" 
            fill="url(#streezTextGrad)" />

      <!-- E 2 -->
      <path d="M 372 350 
               L 432 350 
               L 432 368 
               L 396 368 
               L 396 392 
               L 426 392 
               L 426 408 
               L 396 408 
               L 396 434 
               L 434 434 
               L 424 452 
               L 372 452 
               Z" 
            fill="url(#streezTextGrad)" />

      <!-- Z with Electric Cyan Bevel -->
      <path d="M 442 350 
               L 512 350 
               L 512 366 
               L 470 434 
               L 514 434 
               L 504 452 
               L 434 452 
               L 434 436 
               L 476 368 
               L 442 368 
               Z" 
            fill="url(#streezTextGrad)" />
    </g>
  </g>
</svg>
